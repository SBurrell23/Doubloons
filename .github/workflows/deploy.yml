name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued runs supersede each other rather than
# cancelling a publish that is already underway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the rules engine
        # Several hundred headless AI games, asserting token
        # conservation, card counts and the hand/hold limits.
        run: node scripts/simulate.mjs 200

      - name: Check the netcode
        # Whole multiplayer games over a stand-in transport while
        # players drop, freeze, reload and walk away, the room falls off
        # the broker, and the host itself refreshes. Every game has to
        # finish.
        run: node scripts/netcode-sim.mjs 20

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
